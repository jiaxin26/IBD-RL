[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ibd"
version = "0.1.0"
description = "Interventional Boundary Discovery for RL"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "gymnasium>=0.29",
]

[project.optional-dependencies]
rl = ["stable-baselines3>=2.1", "torch>=2.0"]
dmcontrol = ["dm_control>=1.0", "mujoco>=3.0"]
all = ["stable-baselines3>=2.1", "torch>=2.0", "dm_control>=1.0", "mujoco>=3.0", "matplotlib", "pandas"]

[tool.setuptools.packages.find]
include = ["ibd*", "experiments*"]
